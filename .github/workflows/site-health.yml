name: Site health

# Scheduled checks against the DEPLOYED origin (plan phases 9.2 and 9.4).
#
# `quality.yml` already runs Lighthouse on push, but against a local
# `astro preview` on 127.0.0.1. That cannot see the real path a visitor takes:
# GitHub Pages + Fastly cache behaviour, real network latency, third-party
# origins. This workflow measures the site where people actually get it, and
# probes the response headers the origin really sends.
#
# Both jobs are build-free — they only talk to the live site — so they are
# cheap enough to run on a schedule without competing with the CI pipeline.

on:
  schedule:
    # Weekly, Thursday 04:11 UTC (different day from the link-rot monitor).
    - cron: '11 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  origin-probe:
    # Blocking assertions about the live response: status, charset, document
    # completeness and version leaks. The six headers GitHub Pages cannot set
    # are reported informationally — demanding them here would be permanently
    # red and train everyone to ignore the check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activity freshness guard (weekly canary)
        # quality.yml only runs the freshness guard on push/PR; a dead refresh
        # cron with no pushes would stay green for weeks. This scheduled run is
        # the canary that always fires.
        run: node github-activity/validate.mjs --max-age-days=14

      - name: Probe the canonical origin
        run: node scripts/security-headers.mjs

      - name: Deployed freshness (site must match main)
        # The refresh's deploy dispatch is one-shot: if it fails, the next run sees
        # changed=false and never retries, leaving the site stale while the repo is
        # fresh (the weekly canary only checks repo age). Compare the latest
        # github-pages deployment against main instead.
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          DEP_JSON=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1")
          DEP_SHA=$(echo "$DEP_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);console.log(a.length?a[0].sha:'')})")
          DEP_ID=$(echo "$DEP_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);console.log(a.length?a[0].id:'')})")
          DEP_CREATED=$(echo "$DEP_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);console.log(a.length?a[0].created_at:'')})")
          if [ -z "$DEP_SHA" ]; then echo "::error::No github-pages deployment found."; exit 1; fi
          if [ "$DEP_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Site is stale: deployed ${DEP_SHA:0:7} != main ${MAIN_SHA:0:7}. The deploy dispatch likely failed and was never retried."
            exit 1
          fi
          STATE=$(gh api "repos/${{ github.repository }}/deployments/$DEP_ID/statuses" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);console.log(s.length?s[0].state:'')})")
          case "$STATE" in
            success) echo "Deployed build $MAIN_SHA is live (status success).";;
            queued|waiting|in_progress)
              AGE_S=$(( $(date -u +%s) - $(date -u -d "$DEP_CREATED" +%s) ))
              if [ "$AGE_S" -lt 900 ]; then echo "Deploy of $MAIN_SHA in flight (${AGE_S}s); not failing."; else echo "::error::Deployment for main stuck in $STATE for ${AGE_S}s."; exit 1; fi;;
            *) echo "::error::Latest deployment for main ended in state '$STATE' (site not serving this commit)."; exit 1;;
          esac

  lighthouse-deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit the deployed pages
        # Same thresholds as the push gate in quality.yml, so the two gates
        # cannot disagree about what "good" means. A failure here means the
        # DEPLOYED experience regressed (CDN, cache, third party, or code),
        # which is precisely what the local gate cannot observe.
        run: |
          set -u
          base="https://cristian-cardona-dev.github.io/professional-evolution-portfolio"
          urls=("$base/" "$base/work/" "$base/career/" "$base/evolution/" "$base/es/")
          for i in "${!urls[@]}"; do
            echo "Auditing ${urls[$i]}"
            npx --yes lighthouse@12 "${urls[$i]}" \
              --output=json \
              --output-path="$RUNNER_TEMP/lighthouse-$i.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet || true
          done
          node -e "
            const fs=require('fs');
            const os=require('os');
            const dir=process.env.RUNNER_TEMP||os.tmpdir();
            const urls=['/','/work/','/career/','/evolution/','/es/'];
            const thresholds={performance:0.90,accessibility:0.95,'best-practices':0.9,seo:0.95};
            let fail=false;
            urls.forEach((url,i)=>{
              const path=dir+'/lighthouse-'+i+'.json';
              let report;
              try { report=JSON.parse(fs.readFileSync(path,'utf8')); }
              catch(e) { console.log(url+': NO REPORT ('+e.message+')'); fail=true; return; }
              const cats=report.categories||{};
              for(const[k,v] of Object.entries(thresholds)){
                const score=cats[k]?.score||0;
                console.log(url+' '+k+': '+Math.round(score*100)+'% (min '+Math.round(v*100)+'%)');
                if(score<v){fail=true;}
              }
            });
            if(fail){process.exit(1);}
            console.log('Deployed Lighthouse thresholds passed for all 5 URLs.');
          "
