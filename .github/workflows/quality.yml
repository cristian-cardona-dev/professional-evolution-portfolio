name: Quality pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web
        run: npm --prefix web run build

      - name: Link checker
        run: node --test web/tests/links.test.mjs

      - name: Accessibility (axe-core WCAG 2.2 AA)
        run: node --test web/tests/a11y.test.mjs

      - name: Semantic search index (build-time embeddings, both modes)
        # Honest degradation (no token → keyword-only, zero vectors), the
        # env-gated stub seam (deterministic ranking on a fixed fixture) and the
        # 1.5 MB size budget. The stub is honoured by the build script only;
        # production never sets it and the client bundle has no reference to it.
        run: node --test web/tests/semantic-index.test.mjs

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Accessibility in a real browser (axe-core WCAG 2.2 AA, dark + light)
        # Runs the DOM-based axe spec against the production build, which the
        # harness serves through `astro preview` (port 4322) so the GitHub Pages
        # base path resolves — a bare static server at the root would 404 every
        # asset. The screenshot baselines in tests/visual/visual.spec.mjs are
        # machine-dependent (system fonts, GPU) and are deliberately NOT run in
        # CI: they are a local regression tool. axe is DOM-based, not pixel-based,
        # so this gate is deterministic across runners.
        working-directory: web
        run: npx playwright test tests/visual/axe.spec.mjs

      - name: Start preview server
        # astro preview (not `serve web/dist`): the build emits base-path asset
        # URLs (/professional-evolution-portfolio/_astro/…), which a root static
        # server 404s — Lighthouse would be measuring an UNSTYLED page. astro
        # preview mounts the build at the GitHub Pages base path, like Pages.
        run: |
          npm --prefix web run preview -- --port 4173 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/professional-evolution-portfolio/ > /dev/null && break
            sleep 1
          done

      - name: Lighthouse CI (5 primary pages)
        # Thresholds are honest measured baselines of the correctly-served,
        # styled build — not aspirations. Re-measured 2026-10-12 (astro preview
        # on 127.0.0.1:4173, lighthouse@12.8.2, --headless --no-sandbox
        # --disable-gpu, mobile emulation), 10 runs = 5 URLs x 2: performance
        # 100/100/100/100/100 then 99/100/100/100/100 (floor 99, home), TBT
        # 0-53 ms, and accessibility/best-practices/seo 100 on every URL. The
        # earlier 75-84 figures were CPU contention on a shared machine: the
        # documented CI run 38173955793 (commit 0621f6f, before the C2 image
        # shrink) scored performance 96/100/100/100/99, i.e. this gate's own
        # environment agrees with the higher floor. So the honest floor is 0.99
        # locally and 0.96 on the documented CI run.
        #
        # performance is therefore set to 0.90 = CI-worst floor (0.96) minus
        # 0.06. The extra margin over the previous 0.94 (which was local floor
        # 0.99 minus 0.05) is deliberate: GitHub has announced that
        # ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, and a new runner
        # image can move measured performance before any code changes, so the
        # gate carries headroom for that migration rather than flaking on it.
        # 0.90 still catches real regressions — the pre-optimization CI floor
        # was 96 and the old gate was 0.70 — and the other three categories
        # keep their original passing thresholds.
        #
        # No TBT fix was applied in the E4 task, because real LHRs show there is
        # nothing left to win: TBT 0-53 ms, duplicated-javascript and
        # unused-javascript both score 1 with 0 bytes, forced-reflow-insight is
        # empty, and all page JS costs 32-33 ms of script evaluation. The
        # residual main-thread cost is Style & Layout (675-751 ms on /career/
        # and /evolution/), which is the initial layout of honest content under
        # 4x CPU throttling and completes BEFORE FCP (hence no TBT); every lever
        # that would reduce it (text-rendering, text-wrap: balance,
        # backdrop-filter) changes rendered pixels and is out of scope. The old
        # --budget-path flag was dropped earlier: lighthouse-budget.json's
        # budgets (TBT 200 ms, LCP 2.5 s, keyed on `/`, `/en/`, `/es/`) don't
        # match the base-path URLs audited here and would fail on honest TBT.
        run: |
          set -u
          urls=("/professional-evolution-portfolio/" "/professional-evolution-portfolio/work/" "/professional-evolution-portfolio/career/" "/professional-evolution-portfolio/evolution/" "/professional-evolution-portfolio/es/")
          for i in "${!urls[@]}"; do
            echo "Auditing http://127.0.0.1:4173${urls[$i]}"
            npx --yes lighthouse@12 "http://127.0.0.1:4173${urls[$i]}" \
              --output=json \
              --output-path="/tmp/lighthouse-$i.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo || true
          done
          node -e "
            const fs=require('fs');
            const urls=['/','/work/','/career/','/evolution/','/es/'];
            const thresholds={performance:0.90,accessibility:0.95,'best-practices':0.9,seo:0.95};
            let fail=false;
            urls.forEach((url,i)=>{
              const report=JSON.parse(fs.readFileSync('/tmp/lighthouse-'+i+'.json','utf8'));
              const cats=report.categories;
              for(const[k,v] of Object.entries(thresholds)){
                const score=cats[k]?.score||0;
                console.log(url+' '+k+': '+Math.round(score*100)+'% (min '+Math.round(v*100)+'%)');
                if(score<v){fail=true;}
              }
            });
            if(fail){process.exit(1);}
            console.log('Lighthouse thresholds passed for all 5 URLs.');
          "

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then kill $(cat /tmp/preview.pid) 2>/dev/null || true; fi
          pkill -f "astro preview" || true
