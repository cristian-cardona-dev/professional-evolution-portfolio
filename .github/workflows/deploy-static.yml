name: Deploy static portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Pipeline: web (canonical, Astro redesign) or legacy (rollback, static site/)"
        type: choice
        options: [web, legacy]
        default: web

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-portfolio-production
  cancel-in-progress: false

env:
  PIPELINE: ${{ github.event.inputs.pipeline || 'web' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate portfolio (legacy)
        if: env.PIPELINE == 'legacy'
        run: npm run check
      - name: Validate portfolio (web)
        if: env.PIPELINE == 'web'
        run: npm run check:all

  github-pages:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build GitHub Pages artifact (legacy)
        if: env.PIPELINE == 'legacy'
        env:
          RELEASE_TARGET: github-pages
        run: npm run build:release
      - name: Build GitHub Pages artifact (web)
        if: env.PIPELINE == 'web'
        env:
          # Turnstile sitekey (public by design; rendered into the comments form)
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          # Cloudflare Web Analytics beacon token (public by design; the site's
          # own identifier). Unset -> no beacon script is shipped and /build/
          # states nothing about analytics.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          # Build-time semantic embeddings (F-C): degrades honestly to
          # keyword-only when absent or when the token lacks Workers AI read.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm --prefix web ci
          # The build prints the resume PDFs (E1a) and the per-route social
          # cards (E2b) with Playwright, so the browser has to exist before
          # `run build` reaches those steps.
          npm --prefix web exec -- playwright install --with-deps chromium
          npm --prefix web run build
          node scripts/web-release-manifest.mjs
          mv web/dist dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-worker:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
      url: ${{ vars.CLOUDFLARE_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Cloudflare Worker artifact (legacy)
        if: env.PIPELINE == 'legacy'
        env:
          RELEASE_TARGET: cloudflare-worker
        run: npm run build:release
      - name: Build Cloudflare Worker artifact (web)
        if: env.PIPELINE == 'web'
        env:
          ASTRO_BASE: /
          PUBLIC_CANONICAL_BASE: https://cristian-cardona-dev.github.io/professional-evolution-portfolio/
          # Turnstile sitekey (public by design; rendered into the comments form)
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          # Cloudflare Web Analytics beacon token (public by design; the site's
          # own identifier). Unset -> no beacon script is shipped and /build/
          # states nothing about analytics.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          # Build-time semantic embeddings (F-C): degrades honestly to
          # keyword-only when absent or when the token lacks Workers AI read.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm --prefix web ci
          # Same Playwright steps as the Pages job (E1a PDFs, E2b social
          # cards): both host builds render them, so both need the browser first.
          npm --prefix web exec -- playwright install --with-deps chromium
          npm --prefix web run build
          RELEASE_TARGET=cloudflare-worker node scripts/web-release-manifest.mjs
          mv web/dist dist
      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
