name: Refresh public GitHub activity

# Build-time refresh of `github-activity/snapshot.json`. The browser never calls
# GitHub; this job fetches the allowlisted repositories with the server-side
# `GITHUB_TOKEN`, commits the snapshot when its content actually changed, and
# then asks the deploy workflow to rebuild the static site.
#
# A push made with the default `GITHUB_TOKEN` does not trigger other workflows,
# so the deploy is dispatched explicitly through `gh workflow run` (which needs
# the `actions: write` permission granted below).

on:
  schedule:
    # Every 6 hours (00:17, 06:17, 12:17, 18:17 UTC) — keeps the feed within
    # ~6h of reality. Note: this repo's scheduled runs have historically been
    # delayed 7-10h by the GitHub scheduler, so treat ~6h as the ideal, not
    # the guarantee (plan ruling H=C).
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh snapshot
        id: refresh
        # Total failure exits 1 (by design) but health.json must still be
        # committed below, so the error is allowed to pass to the end of the
        # job and re-raised by the final step.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/activity-refresh.mjs

      - name: Validate snapshot
        run: node github-activity/validate.mjs

      - name: Detect content change (ignoring captured_at)
        id: change
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            import { appendFileSync, readFileSync, existsSync } from "node:fs";
            const strip = (text) => {
              const doc = JSON.parse(text);
              delete doc.captured_at;
              return JSON.stringify(doc);
            };
            // `changed` drives the DEPLOY: only snapshot content matters.
            let changed = false;
            try {
              const head = execSync("git show HEAD:github-activity/snapshot.json", { encoding: "utf8" });
              const work = readFileSync("github-activity/snapshot.json", "utf8");
              changed = strip(head) !== strip(work);
            } catch {
              changed = true;
            }
            // `health_changed` drives the COMMIT of health.json, which must be
            // persisted every run or the 30-day failure history (phase 7.3)
            // could never accumulate across runs.
            let healthChanged = false;
            if (existsSync("github-activity/health.json")) {
              try {
                const head = execSync("git show HEAD:github-activity/health.json", { encoding: "utf8" });
                healthChanged = head !== readFileSync("github-activity/health.json", "utf8");
              } catch {
                healthChanged = true;
              }
            }
            console.log(changed ? "Snapshot content changed." : "Snapshot content unchanged (timestamp only).");
            appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `health_changed=${healthChanged}\n`);
          '

      - name: Commit and push refreshed snapshot
        if: steps.change.outputs.changed == 'true' || steps.change.outputs.health_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity/snapshot.json github-activity/health.json
          if [ "${{ steps.change.outputs.changed }}" = "true" ]; then
            git commit -m "ai(portfolio): refresh public github activity"
          else
            git commit -m "ai(portfolio): record activity refresh health"
          fi
          # Retry push on conflict (another run may have pushed in between).
          pushed=false
          for attempt in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "Push attempt $attempt failed; rebasing and retrying..."
            git pull --rebase origin main
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Could not push the refreshed activity after 3 attempts."
            exit 1
          fi

      - name: Trigger static deploy (web)
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-static.yml -f pipeline=web
          # Verify a *workflow_dispatch* run for THIS dispatch queued within
          # the last 5 minutes; a leftover push-triggered run must not count.
          queued=""
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            RUN_ID=$(gh run list --workflow=deploy-static.yml --event workflow_dispatch \
              --limit 1 --json databaseId,createdAt \
              | jq -r --argjson cutoff "$(($(date +%s) - 300))" \
                '.[0] | select(type == "object" and (.createdAt | fromdateiso8601) >= $cutoff) | .databaseId // empty')
            if [ -n "$RUN_ID" ]; then queued="$RUN_ID"; break; fi
          done
          if [ -z "$queued" ]; then
            echo "::error::Deploy dispatch did not queue a run within 30s. Snapshot committed but site not rebuilt."
            exit 1
          fi
          echo "Deploy run queued: $queued"

      - name: No change
        if: steps.change.outputs.changed != 'true' && steps.change.outputs.health_changed != 'true'
        run: echo "No snapshot content change and no health update; nothing to commit."

      - name: Chronic failure tracking (plan phase 7.3)
        # Reads the health.json this run just updated, surfaces it in the step
        # summary, and keeps AT MOST one open issue per chronically failing
        # repository — matched by exact title so a persistent failure updates
        # the existing issue rather than opening a new one every day. Issues
        # for repositories that recovered are closed automatically.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/health-report.mjs --json > health-report.json

          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("health-report.json", "utf8"));
            const lines = [
              "## Activity refresh health",
              "",
              `repositories with history: **${r.total_repositories}**, streak threshold: **${r.threshold}**`,
              "",
            ];
            if (r.chronic.length === 0) lines.push("- no repository is on a failure streak");
            else for (const c of r.chronic) lines.push(`- \`${c.slug}\`: **${c.streak}** consecutive failures`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

          node -e '
            const r = JSON.parse(require("fs").readFileSync("health-report.json", "utf8"));
            for (const c of r.chronic) console.log(c.slug + "\t" + c.streak);
          ' > chronic.tsv

          PREFIX="Activity refresh: chronic failure"

          if [ -s chronic.tsv ]; then
            while IFS=$'\t' read -r slug streak; do
              title="$PREFIX — $slug"
              existing=$(gh issue list --state open --limit 200 --json number,title \
                --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
              body="## \`$slug\` has failed $streak consecutive refresh runs

          The refresh could not reach this repository on its last $streak run(s). \`github-activity/health.json\` holds the 30-day history.

          Opened automatically by the activity refresh workflow; it closes itself once the repository refreshes successfully again."
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body "$body"
                echo "Updated issue #$existing for $slug."
              else
                gh issue create --title "$title" --body "$body"
                echo "Opened issue for $slug."
              fi
            done < chronic.tsv
          else
            echo "No chronic failures."
          fi

          # Close anything we opened earlier for a repository that recovered.
          gh issue list --state open --limit 200 --json number,title \
            --jq ".[] | select(.title | startswith(\"$PREFIX\")) | \"\(.number)\t\(.title)\"" \
            > open-issues.tsv || true
          if [ -s open-issues.tsv ]; then
            while IFS=$'\t' read -r number title; do
              slug="${title#*— }"
              if ! grep -Fq "$slug" chronic.tsv; then
                gh issue close "$number" --comment "\`$slug\` refreshed successfully again. Closed automatically."
                echo "Closed recovered issue #$number for $slug."
              fi
            done < open-issues.tsv
          fi

      - name: Fail the run if the refresh errored
        # Runs last so the health commit and dispatch above have already
        # happened; a failed refresh must still turn the whole run red.
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Activity refresh failed; see the 'Refresh snapshot' step."
          exit 1
