name = "portfolio-ai-chat-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[build.upload]
format = "modules"

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"
ANTHROPIC_MODEL = "claude-3-haiku-20240307"

# AI binding for Cloudflare AI (backup provider)
[ai]
binding = "AI"

# D1 database for lead capture
[[d1_databases]]
binding = "DB"
database_name = "portfolio-leads"
database_id = "38a41618-6b70-4e32-9200-f267be599a96"

# KV namespace for rate limiting (optional)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""